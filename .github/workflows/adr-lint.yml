name: ADR Linter

on:
  pull_request:
    paths:
      - 'docs/adr/**'

jobs:
  lint-adrs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Run ADR Linter
        run: npm run lint:adrs
