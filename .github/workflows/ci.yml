name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    name: Build, Lint & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check (TypeScript)
        run: npm run typecheck

      - name: Lint (Oxlint)
        run: npm run lint

      - name: Build Packages (CLI, MCP, Web)
        run: npm run build

      - name: Run Test Suite
        run: npm test

  install-smoke-test:
    name: Install Smoke Test (npm pack)
    runs-on: ubuntu-latest
    needs: validate-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Package
        run: npm run build

      - name: Pack Tarball & Smoke Test Installed CLI
        run: |
          TARBALL=$(npm pack --silent | tail -n 1)
          TARBALL_PATH="$(pwd)/${TARBALL}"
          TMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TMP_DIR" "$TARBALL_PATH"' EXIT

          mkdir -p "$TMP_DIR/fixture-repo/fixtures" "$TMP_DIR/fixture-repo/src/core"
          echo "export const engine = true;" > "$TMP_DIR/fixture-repo/src/core/engine.ts"
          cat <<'EOF' > "$TMP_DIR/fixture-repo/fixtures/0001-base.md"
          ---
          id: ADR-0001
          title: Core Architecture
          status: accepted
          affects:
            - "src/core/**"
          ---
          # Core Architecture
          EOF
          cat <<'EOF' > "$TMP_DIR/fixture-repo/fixtures/0002-api.md"
          ---
          id: ADR-0002
          title: API Layer
          status: accepted
          depends_on:
            - ADR-0001
          ---
          # API Layer
          EOF

          git -C "$TMP_DIR/fixture-repo" init
          git -C "$TMP_DIR/fixture-repo" add src/core/engine.ts

          cd "$TMP_DIR"
          npm init -y >/dev/null
          npm install "$TARBALL_PATH"

          test -e ./node_modules/.bin/ndag
          EXPECTED_VER=$(node -e "console.log(require('./node_modules/nirnay-dag/package.json').version)")
          ACTUAL_VER=$(./node_modules/.bin/ndag --version)
          test "$ACTUAL_VER" = "$EXPECTED_VER"

          ./node_modules/.bin/ndag --help
          ./node_modules/.bin/ndag validate ./fixture-repo/fixtures
          ./node_modules/.bin/ndag lint ./fixture-repo/fixtures
          ./node_modules/.bin/ndag why "$TMP_DIR/fixture-repo/src/core/engine.ts" ./fixture-repo/fixtures
          ./node_modules/.bin/ndag blast ADR-0001 ./fixture-repo/fixtures --json
