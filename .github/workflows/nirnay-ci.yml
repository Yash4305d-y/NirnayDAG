name: NirnayDAG CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'adrs/**'
      - 'src/**'

permissions:
  pull-requests: write
  contents: read

jobs:
  validate-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run NirnayDAG Validation
        id: validate
        run: npm run ndag -- validate

      - name: Execute PR Blast Radius Analysis
        id: blast-radius
        run: npx tsx scripts/pr-blast-radius.ts

      - name: Post or Update PR Comment
        uses: actions/github-script@v7
        if: always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const summaryPath = 'nirnay-pr-summary.md';
            
            let body = '';
            if (fs.existsSync(summaryPath)) {
              body = fs.readFileSync(summaryPath, 'utf8');
            } else {
              body = '## ☸️ NirnayDAG Architecture Review\n\nFailed to generate blast radius report. Please check the CI logs.';
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            
            const botComment = comments.find(c => c.user.type === 'Bot' && c.body.includes('NirnayDAG Architecture Review'));
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
